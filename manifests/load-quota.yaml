# ResourceQuota template used by `bash scripts/06-demo.sh start`.
# The demo script randomly sizes this to ~30% or ~50% of the scorer budget
# (40% ± 10 score points of headroom) so clusters can show different scores.
#
# Scorer budget: 20*24 = 480 CPU, ~1680Gi memory.
apiVersion: v1
kind: Namespace
metadata:
  name: load-quota
  labels:
    app.kubernetes.io/part-of: rhacm-dsf-scorer
    app.kubernetes.io/name: load-quota
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: load-quota
  namespace: load-quota
  labels:
    app.kubernetes.io/part-of: rhacm-dsf-scorer
    app.kubernetes.io/name: load-quota
spec:
  hard:
    requests.cpu: "192"      # overwritten by 06-demo.sh start (±10 score sizing)
    requests.memory: 672Gi
    limits.cpu: "384"
    limits.memory: 1344Gi
    pods: "200"
